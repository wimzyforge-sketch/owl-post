# gh-pages에 새로 올리면 홈페이지를 다시 만들어요(다른 사람이 올린 변경은 깃허브가 저절로 다시 만들지 않아서).
name: 홈페이지 다시 만들기
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  pages: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
        env:
          GH_TOKEN: ${{ github.token }}
